---
name: Publish cookbook OCI artifact

"on":
  workflow_call:
    inputs:
      release_tag:
        description: Existing Git release tag to package and publish.
        required: true
        type: string

jobs:
  publish_oci:
    name: Publish OCI cookbook (non-blocking pilot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    concurrency:
      group: cookbook-oci-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      WORKSTATION_IMAGE: cincproject/workstation@sha256:5f0b0005b718eac0b3819ec3b3abe846b620135bc69db269d285be50c5d33f91
    steps:
      - name: Resolve immutable reusable workflow identity
        id: identity
        shell: ruby {0}
        run: |
          require 'base64'
          require 'json'
          require 'net/http'
          uri = URI(ENV.fetch('ACTIONS_ID_TOKEN_REQUEST_URL'))
          uri.query = URI.encode_www_form(URI.decode_www_form(uri.query.to_s) + [['audience', 'cookbook-oci']])
          request = Net::HTTP::Get.new(uri)
          request['Authorization'] = "Bearer #{ENV.fetch('ACTIONS_ID_TOKEN_REQUEST_TOKEN')}"
          response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true, open_timeout: 10, read_timeout: 30) do |http|
            http.request(request)
          end
          response.value
          token = JSON.parse(response.body).fetch('value')
          claims = JSON.parse(Base64.urlsafe_decode64(token.split('.').fetch(1)))
          sha = claims.fetch('job_workflow_sha')
          ref = claims.fetch('job_workflow_ref')
          expected = 'sous-chefs/.github/.github/workflows/publish-cookbook-oci.yml@'
          abort 'Unexpected reusable workflow identity' unless sha.match?(/\A[0-9a-f]{40}\z/) && ref.start_with?(expected)
          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') { |output| output.puts "sha=#{sha}", "ref=#{ref}" }
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |environment|
            environment.puts "OCI_WORK=#{File.join(ENV.fetch('RUNNER_TEMP'), 'cookbook-oci')}"
          end

      - name: Checkout publishing helpers at the executing workflow commit
        id: helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: sous-chefs/.github
          ref: ${{ steps.identity.outputs.sha }}
          path: oci-tools
          persist-credentials: false

      - name: Checkout the release tag
        id: source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: cookbooks/${{ github.event.repository.name }}
          persist-credentials: false

      - name: Stage and package cookbook
        id: package
        env:
          COOKBOOK: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ steps.identity.outputs.ref }}
          WORKFLOW_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OCI_WORK/staged"
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/cookbooks:/cookbooks:ro" \
            -v "$GITHUB_WORKSPACE/oci-tools/oci:/helpers:ro" \
            -v "$OCI_WORK/staged:/out" "$WORKSTATION_IMAGE" \
            /opt/cinc-workstation/embedded/bin/ruby /helpers/stage.rb \
            "/cookbooks/$COOKBOOK" "$COOKBOOK" "$RELEASE_TAG" /out
          python3 oci-tools/oci/artifact.py prepare --work "$OCI_WORK" \
            --name "$COOKBOOK" --tag "$RELEASE_TAG" \
            --repository "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cookbooks/$COOKBOOK" \
            --commit "$(git -C "cookbooks/$COOKBOOK" rev-parse HEAD)" \
            --source-repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA"

      - name: Generate packaged-content SBOM
        id: scan
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ env.OCI_WORK }}/staged/${{ github.event.repository.name }}
          format: spdx-json
          syft-version: v1.51.1
          output-file: ${{ env.OCI_WORK }}/syft.spdx.json
          upload-artifact: false
          upload-release-assets: false
        env:
          SYFT_FILE_METADATA_SELECTION: all
          SYFT_FILE_METADATA_DIGESTS: sha256

      - name: Add cookbook inventory and exact release provenance
        id: inventory
        run: python3 oci-tools/oci/artifact.py inventory --work "$OCI_WORK"

      - name: Install ORAS
        id: oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.4

      - name: Install Cosign
        id: cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v3.1.3

      - name: Authenticate GHCR
        id: login
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish cookbook by digest and attach SPDX
        id: push
        run: python3 oci-tools/oci/artifact.py push --work "$OCI_WORK"

      - name: Reuse independently verified existing evidence
        id: evidence
        run: python3 oci-tools/oci/artifact.py evidence --work "$OCI_WORK"

      - name: Sign cookbook manifest
        id: sign
        if: ${{ steps.evidence.outputs.signature != 'true' }}
        env:
          SUBJECT: ${{ steps.package.outputs.repository }}@${{ steps.package.outputs.manifest_digest }}
        run: cosign sign --yes "$SUBJECT"

      - name: Attest release build inputs
        id: provenance
        if: ${{ steps.evidence.outputs.provenance != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.package.outputs.repository }}
          subject-digest: ${{ steps.package.outputs.manifest_digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ env.OCI_WORK }}/provenance.json
          push-to-registry: true

      - name: Attest packaged-content SPDX
        id: sbom
        if: ${{ steps.evidence.outputs.sbom != 'true' }}
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ steps.package.outputs.repository }}
          subject-digest: ${{ steps.package.outputs.manifest_digest }}
          sbom-path: ${{ env.OCI_WORK }}/sbom.spdx.json
          push-to-registry: true

      - name: Verify retrieved evidence before publishing version tag
        id: evidence_check
        run: python3 oci-tools/oci/artifact.py verify --work "$OCI_WORK"

      - name: Load retrieved cookbook with Cinc
        id: load
        env:
          COOKBOOK: ${{ github.event.repository.name }}
          COOKBOOK_VERSION: ${{ steps.package.outputs.version }}
        run: |
          docker run --rm --network none \
            -v "$OCI_WORK/retrieved:/cookbooks:ro" \
            -v "$GITHUB_WORKSPACE/oci-tools/oci:/helpers:ro" "$WORKSTATION_IMAGE" \
            /opt/cinc-workstation/embedded/bin/ruby /helpers/load.rb \
            /cookbooks "$COOKBOOK" "$COOKBOOK_VERSION"

      - name: Publish verified version tag
        id: tag
        run: python3 oci-tools/oci/artifact.py tag --work "$OCI_WORK"

      - name: Verify anonymous GHCR retrieval
        id: verify
        run: python3 oci-tools/oci/artifact.py anonymous --work "$OCI_WORK"

      - name: Report OCI result
        if: ${{ always() && steps.helpers.outcome == 'success' }}
        env:
          VERIFIED: ${{ steps.verify.outcome }}
          REFERENCE: ${{ steps.verify.outputs.reference }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: ruby oci-tools/oci/report.rb

      - name: Report unavailable OCI helpers
        if: ${{ always() && steps.helpers.outcome != 'success' }}
        run: |
          message='OCI publication incomplete (non-blocking). Publishing helpers could not be loaded.'
          echo "::warning::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
