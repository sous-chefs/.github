---
name: Install Cinc Workstation
author: Sous Chefs
description: >
  Installs Cinc Workstation (open-source Chef Workstation distribution) on the
  GitHub Actions runner. Replaces actionshub/chef-install to avoid omnitruck.chef.io
  checksum mismatch failures. Cinc includes `chef` command wrappers for full compatibility.

inputs:
  version:
    description: >
      Cinc Workstation version to install. Use major version (e.g. '24') for latest
      in that series, or 'latest' for the newest stable release.
    required: false
    default: 'latest'
  channel:
    description: 'Release channel: stable or current'
    required: false
    default: 'stable'
  cache:
    description: 'Cache installed Cinc Workstation on Ubuntu Linux.'
    required: false
    default: 'true'

outputs:
  cache-hit:
    description: 'Whether an exact installed Workstation cache was restored.'
    value: ${{ steps.restore.outputs.cache-hit }}
  version:
    description: 'Resolved version when Ubuntu caching is enabled.'
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    - name: Resolve Cinc Workstation cache key
      id: resolve
      if: runner.os == 'Linux' && inputs.cache == 'true'
      shell: bash
      env:
        CINC_VERSION: ${{ inputs.version }}
        CINC_CHANNEL: ${{ inputs.channel }}
      run: bash "$GITHUB_ACTION_PATH/scripts/cache.sh" resolve

    - name: Restore installed Cinc Workstation cache
      id: restore
      if: steps.resolve.outputs.enabled == 'true'
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.resolve.outputs.path }}
        key: ${{ steps.resolve.outputs.key }}

    - name: Activate cached Cinc Workstation
      if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/cache.sh" restore

    - name: Install Cinc Workstation (Linux/macOS)
      if: runner.os != 'Windows' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        CINC_VERSION: ${{ steps.resolve.outputs.version || inputs.version }}
        CINC_CHANNEL: ${{ inputs.channel }}
      run: |
        set -euo pipefail
        echo "::group::Installing Cinc Workstation v${CINC_VERSION}"
        curl -fsSL https://omnitruck.cinc.sh/install.sh \
          | sudo bash -s -- -P cinc-workstation -c "$CINC_CHANNEL" -v "$CINC_VERSION"
        echo "::endgroup::"

        # Verify installation
        cinc --version || chef --version

    - name: Verify restored Cinc Workstation
      if: steps.restore.outputs.cache-hit == 'true'
      shell: bash
      run: |
        cinc --version
        chef --version
        /usr/bin/kitchen --version

    - name: Archive installed Cinc Workstation
      if: steps.resolve.outputs.enabled == 'true' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/cache.sh" pack

    - name: Save installed Cinc Workstation cache
      if: steps.resolve.outputs.enabled == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ${{ steps.resolve.outputs.path }}
        key: ${{ steps.resolve.outputs.key }}

    - name: Install Cinc Workstation (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Host "::group::Installing Cinc Workstation v${{ inputs.version }}"
        . { iwr -useb https://omnitruck.cinc.sh/install.ps1 } | iex
        install -project cinc-workstation -channel ${{ inputs.channel }} -version ${{ inputs.version }}
        Write-Host "::endgroup::"

        # The MSI updates the registry PATH but not the current session.
        # Refresh it so we can verify immediately, then persist to GITHUB_PATH
        # so subsequent steps can find chef/cinc without their own refresh.
        $machinePath = [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
        $userPath    = [System.Environment]::GetEnvironmentVariable('Path', 'User')
        $env:PATH    = "$machinePath;$userPath"

        # Persist the Cinc bin dir for all later steps
        $cincBin = (Get-Command cinc -ErrorAction SilentlyContinue)?.Source |
                   Split-Path -Parent
        if ($cincBin) {
          "$cincBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }

        # Verify installation in the same session where PATH is already refreshed
        cinc --version

branding:
  icon: download
  color: orange
