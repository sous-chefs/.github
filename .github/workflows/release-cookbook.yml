---
name: release-please

"on":
  workflow_call:
    inputs:
      publish_oci:
        description: Publish signed OCI cookbooks to GHCR (non-blocking pilot).
        required: false
        type: boolean
        default: false
      supermarket_publisher:
        description: >
          Publisher used for Chef Supermarket releases. `workstation` uses
          Cinc Workstation and knife. `cinc-cli` uses the experimental Cinc CLI.
        required: false
        type: string
        default: workstation
      cinc_cli_version:
        description: Cinc CLI version used when supermarket_publisher is `cinc-cli`.
        required: false
        type: string
        default: v0.11.0
      release_tag:
        description: >
          Existing release tag to publish. Leave empty for the normal
          release-please path. Set this when recovering a release that was
          created but failed to publish.
        required: false
        type: string
        default: ""
    secrets:
      token: { required: true }
      supermarket_user: { required: true }
      supermarket_key: { required: true }
      slack_bot_token: { required: true }
      slack_channel_id: { required: true }

jobs:
  validate_release_inputs:
    runs-on: ubuntu-slim
    steps:
      - name: Validate Supermarket publisher
        env:
          SUPERMARKET_PUBLISHER: ${{ inputs.supermarket_publisher }}
        run: |
          case "${SUPERMARKET_PUBLISHER}" in
            workstation|cinc-cli)
              ;;
            *)
              echo "::error::supermarket_publisher must be 'workstation' or 'cinc-cli'"
              exit 1
              ;;
          esac

  release-please:
    needs: validate_release_inputs
    runs-on: ubuntu-slim
    outputs:
      publish_release: ${{ steps.resolve-release.outputs.publish_release }}
      release_created: ${{ steps.resolve-release.outputs.release_created }}
      tag_name: ${{ steps.resolve-release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      body: ${{ steps.resolve-release.outputs.body }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        if: ${{ inputs.release_tag == '' }}
        with:
          token: ${{ secrets.token }}

      - name: Resolve release state for publishing
        id: resolve-release
        env:
          RELEASE_BODY: ${{ steps.release.outputs.body }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RECOVERY_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # Normal releases publish only when release-please created a new
          # release in this run. Recovery runs skip release-please and publish
          # the caller-provided existing tag instead.
          if [ -n "${RECOVERY_RELEASE_TAG}" ]; then
            {
              echo "publish_release=true"
              echo "release_created=false"
              echo "tag_name=${RECOVERY_RELEASE_TAG}"
              echo "body="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${RELEASE_CREATED}" = "true" ]; then
            {
              echo "publish_release=true"
              echo "release_created=true"
              echo "tag_name=${RELEASE_TAG}"
              echo "body<<RELEASE_BODY_EOF"
              echo "${RELEASE_BODY}"
              echo "RELEASE_BODY_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "publish_release=false"
            echo "release_created=false"
            echo "tag_name="
            echo "body="
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        if: ${{ steps.resolve-release.outputs.release_created == 'true' }}

      - name: Upload cookbook as artifact
        if: ${{ steps.resolve-release.outputs.release_created == 'true' }}
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ steps.resolve-release.outputs.tag_name }}
          path: |
            .
            !.git/
            !.github/
            !.kitchen/
            !.vscode/
            !documentation/
            !.gitignore
            !test/
            !spec/
          retention-days: 90
          compression-level: 6

      - name: Generate artifact attestation
        if: ${{ steps.resolve-release.outputs.release_created == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ github.event.repository.name }}-${{ steps.resolve-release.outputs.tag_name }}
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}

  publish_workstation:
    needs: release-please
    if: ${{ needs.release-please.outputs.publish_release == 'true' && inputs.supermarket_publisher == 'workstation' }}
    name: Publish to Supermarket with Cinc Workstation
    runs-on: ubuntu-latest
    container:
      image: cincproject/workstation:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Configure Cinc credentials
        run: |
          mkdir -p ~/.cinc
          echo "${{ secrets.supermarket_key }}" > ~/.cinc/supermarket.pem
          chmod 600 ~/.cinc/supermarket.pem

      - name: Publish to Chef Supermarket
        run: |
          knife supermarket share ${{ github.event.repository.name }} \
            --supermarket-site https://supermarket.chef.io \
            --key ~/.cinc/supermarket.pem \
            --user ${{ secrets.supermarket_user }} \
            --cookbook-path ../

  publish_cinc_cli:
    needs: release-please
    if: ${{ needs.release-please.outputs.publish_release == 'true' && inputs.supermarket_publisher == 'cinc-cli' }}
    name: Publish to Supermarket with Cinc CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install Cinc CLI
        env:
          CINC_VERSION: ${{ inputs.cinc_cli_version }}
        run: |
          url="https://github.com/tas50/cinc-cli/releases/download/${CINC_VERSION}/cinc_${CINC_VERSION}_linux_amd64.tar.gz"
          curl -fsSL "${url}" -o "${RUNNER_TEMP}/cinc.tar.gz"
          tar -xzf "${RUNNER_TEMP}/cinc.tar.gz" -C "${RUNNER_TEMP}" --strip-components=1 "cinc_${CINC_VERSION}_linux_amd64/cinc"
          sudo install "${RUNNER_TEMP}/cinc" /usr/local/bin/cinc
          cinc version
        shell: bash

      - name: Configure Cinc credentials
        run: |
          mkdir -p ~/.cinc
          key_path="${HOME}/.cinc/supermarket.pem"
          credentials_path="${HOME}/.cinc/credentials"
          printf '%s\n' "${{ secrets.supermarket_key }}" > "${key_path}"
          chmod 600 "${key_path}"
          {
            echo "[default]"
            echo 'supermarket_site = "https://supermarket.chef.io"'
            printf 'client_name = "%s"\n' "${{ secrets.supermarket_user }}"
            printf 'client_key = "%s"\n' "${key_path}"
          } > "${credentials_path}"
          chmod 600 "${credentials_path}"
        shell: bash

      - name: Validate Supermarket package
        run: |
          cinc supermarket share ${{ github.event.repository.name }} \
            --dry-run \
            --cookbook-path ../ \
            --config ~/.cinc/credentials \
            --format json
        shell: bash

      - name: Publish to Chef Supermarket
        run: |
          cinc supermarket share ${{ github.event.repository.name }} \
            --supermarket-site https://supermarket.chef.io \
            --cookbook-path ../ \
            --config ~/.cinc/credentials
        shell: bash

  publish_oci:
    needs: release-please
    if: ${{ needs.release-please.outputs.publish_release == 'true' && inputs.publish_oci }}
    name: Publish OCI cookbook (non-blocking pilot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    concurrency:
      group: cookbook-oci-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      WORKSTATION_IMAGE: cincproject/workstation@sha256:5f0b0005b718eac0b3819ec3b3abe846b620135bc69db269d285be50c5d33f91
    steps:
      - name: Resolve immutable reusable workflow identity
        id: identity
        shell: python
        run: |
          import base64, json, os, re, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=cookbook-oci'
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['value']
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          sha, ref = claims['job_workflow_sha'], claims['job_workflow_ref']
          expected = 'sous-chefs/.github/.github/workflows/release-cookbook.yml@'
          if not re.fullmatch('[0-9a-f]{40}', sha) or not ref.startswith(expected):
              raise ValueError('Unexpected reusable workflow identity')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'sha={sha}\nref={ref}\n')
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('OCI_WORK=' + os.environ['RUNNER_TEMP'] + '/cookbook-oci\n')

      - name: Checkout publishing helpers at the executing workflow commit
        id: helpers
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: sous-chefs/.github
          ref: ${{ steps.identity.outputs.sha }}
          path: oci-tools
          persist-credentials: false

      - name: Checkout the release tag
        id: source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          path: cookbooks/${{ github.event.repository.name }}
          persist-credentials: false

      - name: Stage and package cookbook
        id: package
        env:
          COOKBOOK: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          WORKFLOW_REF: ${{ steps.identity.outputs.ref }}
          WORKFLOW_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OCI_WORK/staged"
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/cookbooks:/cookbooks:ro" \
            -v "$GITHUB_WORKSPACE/oci-tools/oci:/helpers:ro" \
            -v "$OCI_WORK/staged:/out" "$WORKSTATION_IMAGE" \
            /opt/cinc-workstation/embedded/bin/ruby /helpers/stage.rb \
            "/cookbooks/$COOKBOOK" "$COOKBOOK" "$RELEASE_TAG" /out
          python3 oci-tools/oci/artifact.py prepare --work "$OCI_WORK" \
            --name "$COOKBOOK" --tag "$RELEASE_TAG" \
            --repository "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cookbooks/$COOKBOOK" \
            --commit "$(git -C "cookbooks/$COOKBOOK" rev-parse HEAD)" \
            --source-repository "$GITHUB_REPOSITORY" \
            --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA"

      - name: Generate packaged-content SBOM
        id: scan
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: ${{ env.OCI_WORK }}/staged/${{ github.event.repository.name }}
          format: spdx-json
          syft-version: v1.51.1
          output-file: ${{ env.OCI_WORK }}/syft.spdx.json
          upload-artifact: false
          upload-release-assets: false
        env:
          SYFT_FILE_METADATA_SELECTION: all
          SYFT_FILE_METADATA_DIGESTS: sha256

      - name: Add cookbook inventory and exact release provenance
        id: inventory
        run: python3 oci-tools/oci/artifact.py inventory --work "$OCI_WORK"

      - name: Install ORAS
        id: oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.4

      - name: Install Cosign
        id: cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v3.1.3

      - name: Authenticate GHCR
        id: login
        run: printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish cookbook by digest and attach SPDX
        id: push
        run: python3 oci-tools/oci/artifact.py push --work "$OCI_WORK"

      - name: Reuse independently verified existing evidence
        id: evidence
        run: python3 oci-tools/oci/artifact.py evidence --work "$OCI_WORK"

      - name: Sign cookbook manifest
        id: sign
        if: ${{ steps.evidence.outputs.signature != 'true' }}
        env:
          SUBJECT: ${{ steps.package.outputs.repository }}@${{ steps.package.outputs.manifest_digest }}
        run: cosign sign --yes "$SUBJECT"

      - name: Attest release build inputs
        id: provenance
        if: ${{ steps.evidence.outputs.provenance != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.package.outputs.repository }}
          subject-digest: ${{ steps.package.outputs.manifest_digest }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ env.OCI_WORK }}/provenance.json
          push-to-registry: true

      - name: Attest packaged-content SPDX
        id: sbom
        if: ${{ steps.evidence.outputs.sbom != 'true' }}
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ steps.package.outputs.repository }}
          subject-digest: ${{ steps.package.outputs.manifest_digest }}
          sbom-path: ${{ env.OCI_WORK }}/sbom.spdx.json
          push-to-registry: true

      - name: Verify retrieved evidence before publishing version tag
        id: evidence_check
        run: python3 oci-tools/oci/artifact.py verify --work "$OCI_WORK"

      - name: Load retrieved cookbook with Cinc
        id: load
        env:
          COOKBOOK: ${{ github.event.repository.name }}
          COOKBOOK_VERSION: ${{ steps.package.outputs.version }}
        run: |
          docker run --rm --network none \
            -v "$OCI_WORK/retrieved:/cookbooks:ro" \
            -v "$GITHUB_WORKSPACE/oci-tools/oci:/helpers:ro" "$WORKSTATION_IMAGE" \
            /opt/cinc-workstation/embedded/bin/ruby /helpers/load.rb \
            /cookbooks "$COOKBOOK" "$COOKBOOK_VERSION"

      - name: Publish verified version tag
        id: tag
        run: python3 oci-tools/oci/artifact.py tag --work "$OCI_WORK"

      - name: Verify anonymous GHCR retrieval
        id: verify
        run: python3 oci-tools/oci/artifact.py anonymous --work "$OCI_WORK"

      - name: Report OCI result
        if: ${{ always() }}
        env:
          VERIFIED: ${{ steps.verify.outcome }}
          REFERENCE: ${{ steps.verify.outputs.reference }}
          STEP_RESULTS: ${{ toJSON(steps) }}
        shell: python
        run: |
          import json, os
          success = os.environ['VERIFIED'] == 'success'
          failed = [key for key, value in json.loads(os.environ['STEP_RESULTS']).items()
                    if value.get('outcome') == 'failure']
          message = ('OCI cookbook verified: ' + os.environ['REFERENCE'] if success else
                     'OCI publication incomplete (non-blocking). Failed steps: ' + ', '.join(failed))
          if not success:
              print('::warning::' + message)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(message + '\n')
              directory = os.environ.get('OCI_WORK', os.path.join(os.environ['RUNNER_TEMP'], 'cookbook-oci'))
              state = os.path.join(directory, 'state.json')
              if os.path.exists(state):
                  for key, value in json.load(open(state)).items():
                      summary.write(f'- {key}: `{value}`\n')

  notify-slack:
    needs: [release-please, publish_workstation, publish_cinc_cli]
    if: ${{ always() && needs.release-please.outputs.publish_release == 'true' && (needs.publish_workstation.result == 'success' || needs.publish_cinc_cli.result == 'success') }}
    runs-on: ubuntu-slim
    steps:
      - name: Post text to a Slack channel
        id: notify-slack
        uses: slackapi/slack-github-action@v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.slack_bot_token }}
          errors: true
          payload: |
            channel: ${{ secrets.slack_channel_id }}
            text: "New release of ${{ github.event.repository.name }} cookbook: ${{ needs.release-please.outputs.tag_name }}"
            attachments:
              - color: "#28a745"
                fields:
                  - title: "Status"
                    short: true
                    value: "Completed"

      - name: Convert release body to Slack mrkdwn
        id: format-body
        if: ${{ needs.release-please.outputs.body != '' }}
        env:
          BODY: ${{ needs.release-please.outputs.body }}
        run: |
          formatted=$(printf '%s' "$BODY" | sed -E \
            -e 's/^#{1,6}[[:space:]]+(.+)$/*\1*/' \
            -e 's/^#{1,6}[[:space:]]*$//' \
            -e 's/\*\*([^*]+)\*\*/*\1*/g' \
            -e 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' \
            -e 's/^([[:space:]]*)[*-][[:space:]]+/\1• /')
          {
            echo "body<<SLACK_EOF"
            echo "$formatted"
            echo "SLACK_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Reply to release message with release details
        if: ${{ needs.release-please.outputs.body != '' }}
        uses: slackapi/slack-github-action@v3.0.5
        with:
          method: chat.postMessage
          token: ${{ secrets.slack_bot_token }}
          errors: true
          payload: |
            channel: ${{ secrets.slack_channel_id }}
            thread_ts: "${{ steps.notify-slack.outputs.ts }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: ${{ toJSON(steps.format-body.outputs.body) }}
