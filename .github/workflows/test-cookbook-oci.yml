---
name: Test cookbook OCI publishing

"on":
  pull_request:
    paths:
      - oci/**
      - .github/workflows/release-cookbook.yml
      - .github/workflows/publish-cookbook-oci.yml
      - .github/workflows/test-cookbook-oci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache-dependency-path: oci/oracle/go.sum
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.4
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        id: syft
        with:
          syft-version: v1.51.1
      - name: Add Syft to PATH
        env:
          SYFT_COMMAND: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT_COMMAND" >> "$GITHUB_PATH"
      - name: Unit tests
        run: python3 -m unittest discover -s oci -p 'test_*.py' -v
      - name: Workflow and shell lint
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -pyflakes=''
          .github/workflows/release-cookbook.yml
          .github/workflows/publish-cookbook-oci.yml
          .github/workflows/test-cookbook-oci.yml
      - name: Real packaging, registry and signature qualification
        run: python3 oci/integration.py
