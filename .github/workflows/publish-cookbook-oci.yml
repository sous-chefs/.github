---
name: Publish cookbook OCI artifact

"on":
  workflow_call:
    inputs:
      release_tag:
        description: Existing Git release tag to package and publish.
        required: true
        type: string

jobs:
  publish_oci:
    name: Publish OCI cookbook
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: cookbooks/${{ github.event.repository.name }}

      - name: Package cookbook with Cinc Workstation
        id: package
        env:
          COOKBOOK: ${{ github.event.repository.name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p oci-output/staged
          docker run --rm --pull always -i \
            -v "$GITHUB_WORKSPACE/cookbooks:/cookbooks:ro" \
            -v "$GITHUB_WORKSPACE/oci-output:/out" \
            cincproject/workstation:latest \
            /opt/cinc-workstation/embedded/bin/ruby - "$COOKBOOK" "$RELEASE_TAG" <<'RUBY'
          require 'chef'
          require 'chef/cookbook_loader'
          require 'chef/knife'
          require 'chef/knife/core/cookbook_site_streaming_uploader'
          require 'fileutils'

          name, tag = ARGV
          cookbook = Chef::CookbookLoader.new('/cookbooks')[name]
          version = cookbook.metadata.version.to_s
          abort 'Release tag does not match cookbook version' unless [version, "v#{version}"].include?(tag)
          staged = Chef::Knife::Core::CookbookSiteStreamingUploader.create_build_dir(cookbook)
          system('tar', '--sort=name', '--mtime=@0', '--owner=0', '--group=0', '--numeric-owner',
                 '-czf', '/out/cookbook.tar.gz', '-C', staged, name, exception: true)
          FileUtils.mv(File.join(staged, name), '/out/staged')
          FileUtils.remove_entry(staged)
          File.write('/out/version', version)
          RUBY
          echo "version=$(cat oci-output/version)" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX
        uses: anchore/sbom-action@v0
        with:
          path: oci-output/staged/${{ github.event.repository.name }}
          format: spdx-json
          output-file: oci-output/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
        env:
          SYFT_FILE_METADATA_SELECTION: all
          SYFT_FILE_METADATA_DIGESTS: sha256

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2

      - name: Prepare the cookbook manifest locally
        id: manifest
        working-directory: oci-output
        env:
          COOKBOOK: ${{ github.event.repository.name }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cookbooks/$COOKBOOK"
          oras push --oci-layout layout:prepared \
            --artifact-type application/vnd.cinc.cookbook.v1+json \
            --annotation org.opencontainers.image.created=1970-01-01T00:00:00Z \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --format json \
            cookbook.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip > manifest.json
          digest=$(jq -er '.digest' manifest.json)
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the SPDX inventory before upload
        id: attest
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.manifest.outputs.repository }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: oci-output/sbom.spdx.json
          create-storage-record: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the signed cookbook and tag the release
        working-directory: oci-output
        env:
          REPOSITORY: ${{ steps.manifest.outputs.repository }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          cp "$BUNDLE" attestation.sigstore.json
          bundle_type=$(jq -er '.mediaType' attestation.sigstore.json)
          subject="$REPOSITORY@$DIGEST"
          oras cp --from-oci-layout "layout@$DIGEST" "$subject"
          oras attach "$subject" --artifact-type "$bundle_type" "attestation.sigstore.json:$bundle_type"
          oras attach "$subject" --artifact-type application/spdx+json sbom.spdx.json:application/spdx+json
          oras tag "$subject" "$VERSION"
          echo "Published signed cookbook $REPOSITORY:$VERSION ($DIGEST)" >> "$GITHUB_STEP_SUMMARY"

      - name: Report publishing failure
        if: ${{ failure() }}
        run: echo '::warning::OCI publication failed; existing cookbook publishing is unaffected.'
